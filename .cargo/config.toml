[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = "line-tables-only"

[profile.release]
incremental = false
debug = "line-tables-only"

[profile.release.package."*"]
debug = false

[profile.release.build-override]
debug = "line-tables-only"

# Most tests compile a Plenty program and link it with `cc`, which looks for
# `ld` in COMPILER_PATH first. Where mold is installed, these links use mold's
# `ld`, several times faster than GNU ld; elsewhere the directory is missing
# and `cc` uses its default linker. This applies only to processes Cargo
# starts, such as tests and `cargo run`; the compiler's default `cc` driver is
# unchanged, and rustc selects its default linker, rust-lld, explicitly. See
# book/src/development/workflow.md.
#
# The test suite compiles thousands of programs that share most of their
# compiled `std` functions. One compiled-function cache per worktree, under
# its target directory, serves every test run and never touches the user's
# ~/.cache (issue #144). `PLENTY_CACHE=off cargo test ...` disables it.
[env]
COMPILER_PATH = "/usr/libexec/mold"
PLENTY_CACHE_DIR = { value = "target/plenty-cache", relative = true }
