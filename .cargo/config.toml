[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.dev.package."*"]
# Optimize third-party dependencies while keeping workspace code easy to debug.
opt-level = 3
debug = false

[profile.dev.build-override]
debug = "line-tables-only"

# CI's test runs (issue #414). Nearly every test compiles a Plenty program, so
# suite time is mostly the compiler's own run time: building it at opt-level 1
# cut the suite's wall time by about a third, for a slower build. Inheriting
# `dev` keeps debug assertions and overflow checks. Locally:
# `cargo nextest run --cargo-profile ci ...`; see
# book/src/development/workflow.md.
[profile.ci]
inherits = "dev"
opt-level = 1
incremental = false
debug = "line-tables-only"

[profile.ci.package."*"]
opt-level = 2
debug = false

[profile.ci.build-override]
debug = "line-tables-only"

[profile.release]
incremental = false
debug = "line-tables-only"

[profile.release.package."*"]
debug = false

[profile.release.build-override]
debug = "line-tables-only"

# Most tests compile a Plenty program and link it with `cc`, which looks for
# `ld` in COMPILER_PATH first. Where mold is installed, these links use mold's
# `ld`, several times faster than GNU ld; elsewhere the directory is missing
# and `cc` uses its default linker. This applies only to processes Cargo
# starts, such as tests and `cargo run`; the compiler's default `cc` driver is
# unchanged, and rustc selects its default linker, rust-lld, explicitly. See
# book/src/development/workflow.md.
#
# The test suite compiles thousands of programs that share most of their
# compiled `std` functions. One compiled-function cache per worktree, under
# its target directory, serves every test run and never touches the user's
# ~/.cache (issue #144). `PLENTY_CACHE=off cargo test ...` disables it.
[env]
COMPILER_PATH = "/usr/libexec/mold"
PLENTY_CACHE_DIR = { value = "target/plenty-cache", relative = true }
# Tests link many programs at once. Each mold link then starts a thread per
# core, and the links compete for the cores; one thread per link is faster
# overall (issue #415). The compiler run outside Cargo keeps mold's threads.
PLENTY_LINKER_THREADS = "1"
