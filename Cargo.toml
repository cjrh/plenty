[package]
name = "plenty"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
# Integration tests are modules of one binary; see tests/integration.rs.
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[workspace]
members = ["plenty-runtime"]
resolver = "2"

[features]
runtime-checks = []
# Developer-only checked-IR Rust emitter; not part of the normal compiler CLI.
rust-source-spike = []
# Opt-in compiler phase profile (issue #150); see book/src/development/profiling.md.
profile = ["dep:hotpath", "hotpath/hotpath"]
profile-alloc = ["profile", "hotpath/hotpath-alloc"]

[dev-dependencies]
rstest = "0.23.0"
regex = "1.12.3"

[dependencies]
log = "0.4.22"
pretty_env_logger = "0.5.0"
# AOT backend (§11.1, §12.3). Cranelift is pure-Rust, no system deps.
# `cranelift-codegen` lowers Cranelift IR (CLIF) to machine code;
# `cranelift-frontend` is the IR builder; `cranelift-module` manages a
# dictionary of declared functions and data; `cranelift-object` lowers a
# finished module to a native object file via the `object` crate.
# `incremental-cache` gives the per-function cache key and the serialized
# compiled stencil behind the compiled-function cache (issue #144).
cranelift-codegen = { version = "0.137.0", features = ["incremental-cache"] }
cranelift-frontend = "0.137.0"
cranelift-module = "0.137.0"
cranelift-object = "0.137.0"
cranelift-native = "0.137.0"
target-lexicon = "0.13"
tempfile = "3.27.0"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "archive", "std"] }
sha2 = { version = "0.10", default-features = false }
# JSON for the language server (`plenty lsp`, issue #155). Pinned: serde and
# its derive are already built for Cranelift, so this adds one crate.
serde_json = "=1.0.154"
# The compiler binaries' global allocator (issue #315). With glibc malloc,
# threads building functions in parallel wait on each other's arena locks:
# a warm-cache build on 16 threads made about 95,000 context switches and
# spent as much time in the kernel as compiling. Version 2 and `no_thp` keep
# peak memory near glibc's; v3, or v2 requesting transparent huge pages, used
# up to twice as much on a 39,000-line program.
mimalloc = { version = "0.1.52", default-features = false, features = ["v2", "no_thp"] }
# Hasher for the compiler's name tables (issue #302). Already built for
# Cranelift and regalloc2; SipHash's flood resistance buys nothing for keys
# taken from the program being compiled.
rustc-hash = "2.1.2"
# Compiler phase profiler, compiled only with the `profile` feature. Pinned:
# its report formats may change between releases.
hotpath = { version = "=0.28.6", optional = true, default-features = false }
# x86-64 decoder and AT&T formatter for `--dump asm` (issue #360). Cranelift's
# own listing (`set_disasm`) has no byte offsets and prints pseudo-instructions
# rather than the final encoding; its `disas` feature would build the C
# Capstone library. Pure Rust, decoder and formatter only.
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "gas"] }

# Run the benchmark's argument-parsing tests with the workspace suite; Cargo
# only builds examples by default.
[[example]]
name = "compile_bench"
test = true

[[example]]
name = "rust_source_spike"
required-features = ["rust-source-spike"]
