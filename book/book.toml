[book]
title = "Plenty"
description = "A statically typed language with Python-shaped syntax and native compilation."
authors = ["Caleb Hattingh"]
language = "en"
src = "src"

[output.html]
default-theme = "ayu"
preferred-dark-theme = "ayu"
site-url = "/plenty/"
# highlight.js grammars for Plenty fences, compiler diagnostics and output.
additional-js = ["theme/plenty-highlight.js"]
additional-css = ["theme/plenty-highlight.css"]

[output.html.fold]
enable = true

[output.html.redirect]
"proposals/error-formatting.html" = "completed/error-formatting.html"
