name: Native OS port qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

# Linux x86-64 and ARM64 already run the full compiler/runtime, optional-engine,
# and Docker suites in ci.yml. These jobs expose the next native OS blockers.
# Failures remain failures: a probe success must not imply a working Plenty port.
jobs:
  compiler:
    name: Plenty native build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      PLENTY_RELEASE_TARGET: ${{ matrix.target }}
      PYTHON: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'python' || 'python3' }}
      CARGO_TARGET_DIR: target/qualification
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Restore qualification dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target/qualification
          key: portability-qualification-v1-${{ matrix.target }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify native compiler host
        env:
          EXPECTED_HOST: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          rustc -vV | tee artifacts/toolchain.txt
          rustc -vV | grep -Fx "host: $EXPECTED_HOST"
          python -c 'import platform; print(platform.platform()); print(platform.machine())' | tee artifacts/host.txt
      - name: Check native build-tool boundary
        run: |
          set -o pipefail
          rustc --edition 2024 --test plenty-runtime/native/tools.rs -o artifacts/native-tools-tests.exe
          artifacts/native-tools-tests.exe --nocapture 2>&1 | tee artifacts/native-tools-tests.log
      - name: Check native crypto source selection
        run: |
          set -o pipefail
          rustc --edition 2024 --test plenty-runtime/native/ring_sources.rs -o artifacts/ring-sources-tests.exe
          artifacts/ring-sources-tests.exe --nocapture 2>&1 | tee artifacts/ring-sources-tests.log
      - name: Check native runtime boundaries
        run: |
          set -o pipefail
          cargo test --locked --manifest-path plenty-runtime/platform-tests/Cargo.toml -- --nocapture 2>&1 | tee artifacts/runtime-boundary-tests.log
      - name: Build actual compiler and runtime
        run: |
          set -o pipefail
          cargo build --locked --workspace --timings 2>&1 | tee artifacts/build.log
      - name: Run compiler and runtime unit tests
        run: |
          set -o pipefail
          cargo test --locked --workspace --lib --no-fail-fast -- --nocapture --test-threads=1 2>&1 | tee artifacts/unit-tests.log
      # The integration suite is not qualified on macOS yet. Run the
      # stack-overflow tests: their signal-frame handling is Darwin-specific.
      - name: Run AArch64 stack-probe integration tests
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          cargo test --locked --test integration test_arm_stack_probes:: -- --nocapture 2>&1 | tee artifacts/arm-stack-probe-tests.log
      - name: Select pinned release environment
        run: |
          . scripts/release/toolchain.env
          . scripts/release/target.sh
          rustup toolchain install "$RUST_VERSION" --profile minimal
          {
            echo "RUSTUP_TOOLCHAIN=$RUST_VERSION"
            echo "RUSTFLAGS=-C target-cpu=$release_cpu"
            echo "PLENTY_RUNTIME_RUSTFLAGS=-C target-cpu=$release_cpu"
            echo "CARGO_TARGET_DIR=target/native-release"
            if [ "$release_os" = macos ]; then echo "MACOSX_DEPLOYMENT_TARGET=$release_macos_min"; fi
          } >> "$GITHUB_ENV"
      - name: Restore release compiler dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target/native-release
          shared-key: portability-release-v2-${{ matrix.target }}-${{ hashFiles('scripts/release/target.sh') }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and test release compiler
        run: scripts/release/build-native.sh --out-dir dist --test --phase prepare 2>&1 | tee artifacts/release-build.log
      - name: Preserve release compiler for packaging
        run: |
          . scripts/release/target.sh
          tar -cf compiler.tar -C target/native-release/release "plenty$release_exe" "plentyc$release_exe"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-compiler-${{ matrix.target }}
          path: compiler.tar
          retention-days: 1
          if-no-files-found: error
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portability-${{ matrix.target }}
          path: |
            artifacts/
            target/qualification/cargo-timings/*.html
          retention-days: 14
          if-no-files-found: warn

  dataframe:
    name: Native dataframe engine (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      PYTHON: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'python' || 'python3' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select pinned engine toolchain
        run: |
          . scripts/release/toolchain.env
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      # The compiler cache never traverses this workspace's target directory.
      - name: Restore engine dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: plenty-dataframe -> target
          shared-key: portability-dataframe-v2-${{ matrix.target }}-${{ hashFiles('scripts/build_native_engine.py') }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and validate dataframe engine
        run: |
          "$PYTHON" -B scripts/build_native_engine.py dataframe --target "${{ matrix.target }}" --target-dir plenty-dataframe/target --out artifacts/engine --validate
          tar -cf artifacts/engine.tar -C artifacts/engine .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-dataframe-${{ matrix.target }}
          path: artifacts/engine.tar
          retention-days: 1
          if-no-files-found: error

  package:
    name: Native package qualification (${{ matrix.target }})
    needs: [compiler, dataframe]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PLENTY_RELEASE_TARGET: ${{ matrix.target }}
      PYTHON: ${{ matrix.target == 'x86_64-pc-windows-msvc' && 'python' || 'python3' }}
      CARGO_TARGET_DIR: target/native-release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install packaging toolchain and license data
        run: |
          . scripts/release/toolchain.env
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rust-docs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-compiler-${{ matrix.target }}
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-dataframe-${{ matrix.target }}
          path: artifacts
      - name: Assemble, audit and smoke-test native release
        run: |
          mkdir -p target/native-release/release
          tar -xf artifacts/compiler.tar -C target/native-release/release
          tar -xf artifacts/engine.tar -C target/native-release/release
          scripts/release/build-native.sh --out-dir dist --phase package --engine-dir target/native-release/release
          . scripts/release/target.sh
          "$PYTHON" -B scripts/release/smoke-native.py dist/plenty-*-"$PLENTY_RELEASE_TARGET.$release_archive_ext"
