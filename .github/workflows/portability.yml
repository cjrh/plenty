name: Native OS port qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

# Linux x86-64 and ARM64 already run the full compiler/runtime, optional-engine,
# and Docker suites in ci.yml. These jobs expose the next native OS blockers.
# Failures remain failures: a probe success must not imply a working Plenty port.
jobs:
  compiler:
    name: Plenty native build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Verify native compiler host
        env:
          EXPECTED_HOST: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          rustc -vV | tee artifacts/toolchain.txt
          rustc -vV | grep -Fx "host: $EXPECTED_HOST"
          python -c 'import platform; print(platform.platform()); print(platform.machine())' | tee artifacts/host.txt
      - name: Check native build-tool boundary
        run: |
          set -o pipefail
          rustc --edition 2024 --test plenty-runtime/native/tools.rs -o artifacts/native-tools-tests.exe
          artifacts/native-tools-tests.exe --nocapture 2>&1 | tee artifacts/native-tools-tests.log
      - name: Check native crypto source selection
        run: |
          set -o pipefail
          rustc --edition 2024 --test plenty-runtime/native/ring_sources.rs -o artifacts/ring-sources-tests.exe
          artifacts/ring-sources-tests.exe --nocapture 2>&1 | tee artifacts/ring-sources-tests.log
      - name: Check native runtime boundaries
        run: |
          set -o pipefail
          cargo test --locked --manifest-path plenty-runtime/platform-tests/Cargo.toml -- --nocapture 2>&1 | tee artifacts/runtime-boundary-tests.log
      - name: Build actual compiler and runtime
        run: |
          set -o pipefail
          cargo build --locked --workspace --timings 2>&1 | tee artifacts/build.log
      - name: Run compiler and runtime unit tests
        run: |
          set -o pipefail
          cargo test --locked --workspace --lib 2>&1 | tee artifacts/unit-tests.log
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portability-${{ matrix.target }}
          path: |
            artifacts/
            target/cargo-timings/*.html
          retention-days: 14
          if-no-files-found: warn
