[package]
name = "plenty-egui"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "staticlib"]

[features]
legacy-application = ["application"]
application = ["dep:eframe", "dep:plenty-runtime", "plenty-runtime/executable"]

[dependencies]
url = "=2.5.8"
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
eframe = { optional = true, version = "=0.37.0", default-features = false, features = ["glow", "x11", "default_fonts", "links"] }
plenty-runtime = { path = "../../../../plenty-runtime", optional = true }

[build-dependencies]
cc = "1"

[profile.dev]
debug = 0

[profile.release]
strip = "debuginfo"
