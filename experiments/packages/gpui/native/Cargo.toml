[package]
name = "plenty-gpui"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "staticlib"]

[features]
application = ["dep:plenty-runtime", "plenty-runtime/executable"]

[dependencies]
plenty-runtime = { path = "../../../../plenty-runtime", optional = true }
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11"] }

[build-dependencies]
cc = "1"

[profile.dev]
debug = 0

[profile.release]
strip = "debuginfo"
