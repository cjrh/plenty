[package]
name = "plenty-iced"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["rlib", "staticlib"]

[features]
legacy-application = ["application"]
application = ["dep:iced", "dep:plenty-runtime", "plenty-runtime/executable"]

[dependencies]
iced = { optional = true, version = "=0.14.0", default-features = false, features = ["tiny-skia", "x11", "thread-pool", "image-without-codecs"] }
plenty-runtime = { path = "../../../../plenty-runtime", optional = true }

[build-dependencies]
cc = "1"

[profile.dev]
debug = 0

[profile.release]
strip = "debuginfo"
