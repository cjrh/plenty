<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Plenty</title>
  <link rel="stylesheet" href="@SITE_PREFIX@assets/site.css">
</head>
<body>
  <div class="page">
    <header class="site-header"><a class="wordmark" href="@SITE_PREFIX@">Plenty</a></header>
    <main class="hero">
      <p class="eyebrow">404</p>
      <h1>We couldn’t find<br><span>that page.</span></h1>
      <p class="introduction">Looking for the language guide or reference? Plenty’s documentation has a home of its own.</p>
      <div class="actions"><a class="button primary" href="@DOCS_PREFIX@">Open the docs</a><a class="button secondary" href="@SITE_PREFIX@">Back to Plenty</a></div>
    </main>
  </div>
  <script>
    const routes = @DOCS_ROUTES@;
    for (const [prefix, destination] of routes) {
      if (location.pathname.startsWith(prefix) && location.pathname !== destination) {
        location.replace(destination + location.search + location.hash);
        break;
      }
    }
  </script>
</body>
</html>
