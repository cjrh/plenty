# nginx in front of tests/fixtures/proxy/server.plenty, for
# tests/test_std_http_server_proxy.rs. The test replaces @UPSTREAM_PORT@,
# @HTTP_PORT@ and @TLS_PORT@ with free loopback ports and mounts the
# configuration and certificates at /etc/plenty-proxy.
worker_processes 1;
error_log stderr info;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log off;

    upstream plenty {
        server 127.0.0.1:@UPSTREAM_PORT@;
        # Reuse connections to the server.
        keepalive 8;
    }

    # Short enough for the slow-client and slow-upstream tests.
    client_header_timeout 2s;
    client_max_body_size 16m;
    proxy_read_timeout 2s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 127.0.0.1:@HTTP_PORT@;
        listen 127.0.0.1:@TLS_PORT@ ssl;
        ssl_certificate /etc/plenty-proxy/leaf.pem;
        ssl_certificate_key /etc/plenty-proxy/leaf.key;

        # The default: whole requests are buffered before they are forwarded.
        location / {
            proxy_pass http://plenty;
        }

        # Bodies stream in both directions.
        location /stream/ {
            proxy_pass http://plenty;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
