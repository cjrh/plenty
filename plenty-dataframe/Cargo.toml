[package]
name = "plenty-dataframe-engine"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "plenty_dataframe_v1"
crate-type = ["cdylib", "rlib"]

[profile.release]
strip = "debuginfo"

[dependencies]
# Polars 0.55.2's string dispatch imports polars_time unconditionally. Temporal
# enables that supported dependency path; no date/time facade API is exposed.
polars = { version = "=0.55.2", default-features = false, features = ["csv", "lazy", "parquet", "regex", "strings", "temporal"] }
