[package]
name = "plenty-dataframe-engine"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
name = "plenty_dataframe_v1"
crate-type = ["cdylib", "rlib"]

[profile.release]
strip = "debuginfo"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
# Polars 0.55.2's string dispatch imports polars_time unconditionally. Temporal
# enables that supported dependency path and the Date/Datetime expression kernels.
polars = { version = "=0.55.2", default-features = false, features = ["asof_join", "csv", "dtype-date", "dtype-datetime", "dtype-i16", "dtype-i8", "dtype-struct", "dtype-u16", "dtype-u8", "lazy", "parquet", "regex", "semi_anti_join", "strings", "temporal"] }
