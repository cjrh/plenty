[package]
name = "plenty-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
allocation-checks = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(plenty_runtime_embedded)'] }

[dependencies]
hmac = "=0.12.1"
sha2 = { version = "=0.10.9", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
