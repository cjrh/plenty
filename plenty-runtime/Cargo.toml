[package]
name = "plenty-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[features]
allocation-checks = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(plenty_runtime_embedded)', 'cfg(plenty_runtime_sqlite)'] }

[dependencies]
hmac = "=0.12.1"
sha1 = { version = "=0.10.6", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
# `__internal-api` exposes the zlib-style init/step/end calls, which report
# allocation failure instead of aborting; see src/aggregates/compress.rs.
zlib-rs = { version = "=0.6.8", default-features = false, features = ["std", "__internal-api"] }
# `std.tls`: rustls over the ring provider, TLS 1.2 and 1.3, without logging.
# See book/src/design/stdlib/tls.md for the backend and update policy.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
siphasher = { version = "=1.0.4", default-features = false }
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }
libc = "=0.2.186"
